org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Parallel transforms often fail on Windows with "Could not move temporary workspace".
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.vfs.watch=false
android.useAndroidX=true
# Pub cache is on C: while the project is on F:; Kotlin incremental caches
# cannot relativize paths across Windows drive roots.
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
